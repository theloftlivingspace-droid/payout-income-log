name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - '**.gs'
      - 'appsscript.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force 2>&1 || (echo "=== clasp push failed ===" && exit 1)

      - name: Deploy new version (update existing Web App deployment)
        # NOTE: this MUST match the deployment ID baked into every consumer's
        # GAS_STYLE_URL / PAYOUT_GAS_URL (hotel-line-bot bot.js + email-sync.js,
        # loft-booking-invoice-todo Code.gs). Previously pointed at an orphaned
        # deployment (AKfycbz3r-wE...) that nothing calls, so CI/CD silently
        # deployed to a webapp URL no consumer ever hits — every push looked
        # successful but the live /exec endpoint kept running stale code.
        # 2026-08-03: same failure mode recurred — the AKfycbyAP9Z... deployment
        # above was archived/deleted directly in the Apps Script UI (outside of
        # clasp), so `clasp deploy` kept reporting success while /exec 404'd.
        # 2026-09-09: recurred a THIRD time — AKfycbxwlKBt... (set above on
        # 2026-08-03) was also archived/deleted outside of clasp at some point
        # after that, so every push since then silently deployed to a dead
        # /exec endpoint again (confirmed: real doGet code changes landed on
        # GitHub and clasp push/deploy both reported success, but the live URL
        # returned Google's generic "unable to open the file" error). Updated
        # below to the deployment ID Nathan confirmed is currently live —
        # if this happens a fourth time, check first whether `clasp deployments`
        # still lists this ID before assuming the code push itself failed.
        run: clasp deploy --deploymentId AKfycbxATx-qQyGBbDYhL--m7wid6PhNGecvDzAEt_9rVdix_xKZO1N3JePp7wOsbElDu0s --description "Auto-deploy from GitHub Actions ${{ github.sha }}"
